name: Deploy to EKS (Fargate)

on:
  workflow_run:
    workflows: ["CI - Lint, Test & Security Scan"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: aimlops-fargate

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        project:
          - name: terraform-review-agent
            port: "8001"
          - name: infrastructure-auditor
            port: "8002"
          - name: k8s-debugger
            port: "8003"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Deploy to Fargate
        env:
          PROJECT: ${{ matrix.project.name }}
          PORT: ${{ matrix.project.port }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${PROJECT}
            labels:
              app: ${PROJECT}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ${PROJECT}
            template:
              metadata:
                labels:
                  app: ${PROJECT}
              spec:
                containers:
                - name: ${PROJECT}
                  image: ${ECR_REGISTRY}/aimlops-${PROJECT}:${IMAGE_TAG}
                  ports:
                  - containerPort: ${PORT}
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "500m"
                    limits:
                      memory: "1Gi"
                      cpu: "1024m"
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: ${PORT}
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: ${PORT}
                    initialDelaySeconds: 45
                    periodSeconds: 15
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${PROJECT}
          spec:
            type: LoadBalancer
            selector:
              app: ${PROJECT}
            ports:
            - port: ${PORT}
              targetPort: ${PORT}
          EOF

      - name: Wait for Fargate startup
        run: sleep 60

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ matrix.project.name }} --timeout=180s
          echo "Deployed: ${{ matrix.project.name }}"

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Check all deployments
        run: |
          echo "=== All Deployments ==="
          kubectl get deployments
          echo ""
          echo "=== All Services ==="
          kubectl get services
          echo ""
          echo "=== All Pods ==="
          kubectl get pods
